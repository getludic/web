name: Deploy tag

on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-central-1
      ECR_REPOSITORY: ludic-web
      LAMBDA_FUNCTION: ludic-web
      INDEX_S3_BUCKET: ludic-web-search-index

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
        run: |
          # --provenance=false: Lambda doesn't accept OCI attestation manifests.
          # --platform linux/amd64: must match aws_lambda_function.architectures.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            -t "$IMAGE" \
            .
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "image_uri=${IMAGE%:*}@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build and upload search index
        run: uv run python scripts/build_search_index.py

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "${{ steps.build.outputs.image_uri }}" \
            --publish \
            --region "$AWS_REGION"
